<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Календарь стартов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f0;--ink:#1d2b22;--muted:#5d6b62;--line:#d5dbd2;
  --forest:#2f5d3a;--on-forest:#f2f4f0;--flag:#c4147a;--chip:#e4e9e1;
  color-scheme:light dark;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111914;--ink:#e7ece6;--muted:#9aa89e;--line:#2a362e;--forest:#7fbf8d;--on-forest:#111914;--flag:#e65aae;--chip:#223027}
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font:600 clamp(20px,5.5vw,28px)/1.15 Unbounded,Onest,system-ui,sans-serif;margin:0 0 8px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.note{background:var(--chip);border-left:3px solid var(--flag);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;margin:0 0 20px}
.filters{display:grid;gap:10px;margin-bottom:8px}
.group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.group span{font-size:14px;color:var(--muted);min-width:5.5em}
button.chip{font:500 14px Onest,system-ui,sans-serif;color:var(--ink);background:var(--chip);border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--forest);color:var(--on-forest);font-weight:600}
button.chip:focus-visible,a:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.count{color:var(--muted);font-size:14px;margin:12px 0 0}
h2{font:600 15px/1.3 Onest,system-ui,sans-serif;color:var(--forest);margin:24px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.ev{display:grid;grid-template-columns:60px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.cp{width:54px;height:54px;border:3px solid var(--flag);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--flag)}
.cp b{font:600 19px Unbounded,Onest,sans-serif}
.cp small{font-size:11px;margin-top:3px;color:var(--muted)}
.ev h3{font:600 17px/1.3 Onest,system-ui,sans-serif;margin:0 0 4px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;background:var(--chip);border-radius:6px;padding:2px 8px}
.tag.r{background:transparent;border:1px solid var(--forest);color:var(--forest)}
a.more{display:inline-block;margin-top:10px;font-weight:600;font-size:14px;color:var(--forest)}
.empty{padding:28px 0;color:var(--muted)}
.empty button{margin-top:10px}
footer{margin-top:32px;color:var(--muted);font-size:14px}
.panel{margin-top:10px}.regs{margin-top:12px}
.fld{display:grid;gap:4px;margin:8px 0;font-size:14px;color:var(--muted)}
.fld input,.fld select{font:400 16px Onest,system-ui,sans-serif;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.cons{display:block;font-size:14px;margin:8px 0}
.reg{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1;min-width:0;font:400 16px Onest,system-ui,sans-serif;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.cald{margin:8px 0}.cald summary{cursor:pointer;font-size:14px;color:var(--muted);padding:6px 0}
.month h4{margin:10px 0 6px;font:600 14px Onest,sans-serif}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:340px}
.grid button{font:500 14px Onest,sans-serif;color:var(--ink);background:var(--chip);border:0;border-radius:8px;padding:7px 0;cursor:pointer}
.grid button:disabled{opacity:.3;cursor:default}
.grid button[aria-pressed="true"]{background:var(--flag);color:#fff}
.card{background:var(--chip);border-radius:14px;overflow:hidden;margin:14px 0}
.poster{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--forest),var(--flag));display:flex;align-items:center;justify-content:center}
.poster img{width:100%;height:100%;object-fit:cover}
.poster .cp{background:var(--bg);width:68px;height:68px}
.badge{position:absolute;left:10px;top:10px;background:var(--flag);color:#fff;font:600 13px Onest,sans-serif;padding:4px 10px;border-radius:999px}
.heart{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);color:var(--flag);font-size:18px;cursor:pointer}
.cbody{padding:12px 14px 14px}.card .tag{background:var(--bg)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<main class="wrap">
  <h1>Календарь стартов</h1>
  <p class="lead">Молдова и Приднестровье: ориентирование, бег и другие соревнования.</p>
  <p class="note" id="note">Это прототип. События в списке придуманы для примера.</p>

  <div class="bar">
    <input id="q" type="search" placeholder="Поиск: название, город, клуб" aria-label="Поиск">
    <button type="button" class="chip" id="bFav" aria-pressed="false">♡ Избранное</button>
  </div>
  <div class="filters">
    <div class="group" id="fSport"><span>Вид спорта</span></div>
    <div class="group" id="fRegion"><span>Где</span></div>
    <div class="group" id="fPrice"><span>Цена</span></div>
  </div>
  <details class="cald"><summary>Календарь</summary><div id="cal"></div></details>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="list"><p class="empty">Загружаем события…</p></div>

  <footer>Хотите добавить событие? Напишите организатору календаря.</footer>
</main>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
var EVENTS = [];
var state = {sport:"Все", region:"Все", price:"Все", q:"", day:"", fav:false};
var MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
var $ = function(id){return document.getElementById(id)};

/* Цвета из темы Telegram (вне Telegram остаются цвета по умолчанию) */
function applyTheme(){
  if(!tg || !tg.themeParams) return;
  var t = tg.themeParams, s = document.documentElement.style;
  if(t.bg_color) s.setProperty("--bg", t.bg_color);
  if(t.text_color) s.setProperty("--ink", t.text_color);
  if(t.hint_color) s.setProperty("--muted", t.hint_color);
  if(t.secondary_bg_color) s.setProperty("--chip", t.secondary_bg_color);
  if(t.button_color) s.setProperty("--forest", t.button_color);
  if(t.button_text_color) s.setProperty("--on-forest", t.button_text_color);
  if(t.section_separator_color) s.setProperty("--line", t.section_separator_color);
  try{ tg.setHeaderColor("bg_color"); tg.setBackgroundColor("bg_color"); }catch(e){}
}
if(tg){
  try{ tg.ready(); tg.expand(); }catch(e){}
  applyTheme();
  tg.onEvent && tg.onEvent("themeChanged", applyTheme);
}

function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text!==undefined) n.textContent = text;
  return n;
}
function uniq(key){
  var out = ["Все"];
  EVENTS.forEach(function(e){ if(e[key] && out.indexOf(e[key])<0) out.push(e[key]); });
  return out;
}
function mkChips(box, key, values){
  values.forEach(function(v){
    var b = el("button","chip",v);
    b.type = "button";
    b.setAttribute("aria-pressed", String(state[key]===v));
    b.addEventListener("click", function(){
      state[key] = v;
      box.querySelectorAll("button").forEach(function(x){
        x.setAttribute("aria-pressed", String(x.textContent===v));
      });
      render();
    });
    box.appendChild(b);
  });
}
function openExternal(url){
  if(tg && tg.openLink) tg.openLink(url);
  else window.open(url, "_blank", "noopener");
}
function safeUrl(u){
  return /^https?:\/\//i.test(u||"") ? u : "";
}
var API = "https://script.google.com/macros/s/AKfycbwcy9tTwYA17EBHmlCLAL4D-ygbJfGxjDUm85DOp5qOhsJDIvwMuevGfhTdsh8Va-J2/exec";
var GROUPS = [];
["М","Ж"].forEach(function(s){[10,12,14,16,18,21,35,40,45,50,55,60,65].forEach(function(a){GROUPS.push(s+a)})});
function api(action, data){
  var body = JSON.stringify(Object.assign({action:action, initData: tg ? tg.initData : ""}, data||{}));
  return fetch(API, {method:"POST", body:body}).then(function(r){return r.json()});
}
function field(label, input){
  var w = el("label","fld"); w.appendChild(el("span","",label)); w.appendChild(input); return w;
}
function inp(type, ph){
  var i = document.createElement("input"); i.type = type; i.placeholder = ph||""; return i;
}
function togglePanel(e, host){
  if(host.firstChild){ host.textContent = ""; return; }
  var fio = inp("text","Фамилия Имя"), yr = inp("number","Год рождения"), club = inp("text","Клуб, если есть");
  var grp = document.createElement("select");
  GROUPS.forEach(function(g){ var o = document.createElement("option"); o.textContent = g; grp.appendChild(o); });
  var ok = inp("checkbox"), cons = el("label","cons");
  cons.appendChild(ok); cons.appendChild(document.createTextNode(" Согласен(на) на обработку моих данных для участия в старте"));
  var st = el("p","meta"), send = el("button","chip","Отправить заявку");
  send.type = "button"; send.setAttribute("aria-pressed","true");
  var regs = el("div","regs");
  function load(){
    api("list",{eventId:e.id}).then(function(r){
      regs.textContent = "";
      if(!r.ok){ regs.textContent = r.error || "Ошибка"; return; }
      regs.appendChild(el("p","meta","Заявлено: "+r.items.length));
      r.items.forEach(function(x){
        var row = el("div","reg",x.fio+", "+(x.club||"без клуба")+", "+x.group);
        if(x.mine){
          var c = el("button","chip","Отменить"); c.type = "button";
          c.onclick = function(){ api("cancel",{id:x.id}).then(load); };
          row.appendChild(c);
        }
        regs.appendChild(row);
      });
    }).catch(function(){ regs.textContent = "Не удалось загрузить список."; });
  }
  send.onclick = function(){
    if(!ok.checked){ st.textContent = "Нужно согласие на обработку данных."; return; }
    send.disabled = true; st.textContent = "Отправляем…";
    api("register",{eventId:e.id,fio:fio.value,year:yr.value,club:club.value,group:grp.value,consent:true})
      .then(function(r){
        send.disabled = false;
        if(r.ok){ st.textContent = "Заявка принята."; fio.value = ""; load(); }
        else st.textContent = r.error || "Ошибка";
      }).catch(function(){ send.disabled = false; st.textContent = "Нет связи с сервером."; });
  };
  [field("ФИО",fio),field("Год рождения",yr),field("Клуб",club),field("Группа",grp),cons,send,st,regs]
    .forEach(function(n){ host.appendChild(n); });
  load();
}
function today(){
  var n = new Date();
  var m = String(n.getMonth()+1); if(m.length<2) m = "0"+m;
  var d = String(n.getDate()); if(d.length<2) d = "0"+d;
  return n.getFullYear()+"-"+m+"-"+d;
}
var MG = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var FAVS = [], SHARE_BASE = "https://t.me/orient_calendarbot/orient_calendar_md";
function ymd(n){var m=n.getMonth()+1,d=n.getDate();return n.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(d<10?"0":"")+d}
function label(d){
  if(d===ymd(new Date())) return "Сегодня";
  if(d===ymd(new Date(Date.now()+864e5))) return "Завтра";
  var p = d.split("-"); return (+p[2])+" "+MG[+p[1]-1];
}
function isFree(e){ return !e.price || /^бесплатно/i.test(e.price); }
function cloud(){ try{ return tg && tg.CloudStorage && tg.isVersionAtLeast("6.9"); }catch(x){ return false; } }
function loadFavs(cb){
  if(cloud()){
    tg.CloudStorage.getItem("favs", function(err,v){ try{ FAVS = JSON.parse(v||"[]"); }catch(x){} cb(); });
    return;
  }
  try{ FAVS = JSON.parse(localStorage.getItem("favs")||"[]"); }catch(x){}
  cb();
}
function saveFavs(){
  var s = JSON.stringify(FAVS);
  try{ if(cloud()) tg.CloudStorage.setItem("favs", s); else localStorage.setItem("favs", s); }catch(x){}
}
function share(e){
  var link = SHARE_BASE+"?startapp="+encodeURIComponent(e.id);
  var u = "https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent(e.t);
  if(tg && tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u,"_blank","noopener");
}
function resetAll(){
  state = {sport:"Все", region:"Все", price:"Все", q:"", day:"", fav:false};
  $("q").value = ""; $("bFav").setAttribute("aria-pressed","false");
  document.querySelectorAll(".filters .chip").forEach(function(x){
    x.setAttribute("aria-pressed", String(x.textContent==="Все"));
  });
  renderCal(); render();
}
function renderCal(){
  var cal = $("cal"); cal.textContent = "";
  var has = {}, months = [], t0 = today();
  EVENTS.forEach(function(e){ if(e.d>=t0) has[e.d] = 1; });
  Object.keys(has).sort().forEach(function(d){ var k = d.slice(0,7); if(months.indexOf(k)<0) months.push(k); });
  months.forEach(function(k){
    var y = +k.slice(0,4), m = +k.slice(5), box = el("div","month");
    var mn = MG[m-1]; box.appendChild(el("h4","",mn.charAt(0).toUpperCase()+mn.slice(1)+" "+y));
    var g = el("div","grid"), first = (new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7, n = new Date(Date.UTC(y,m,0)).getUTCDate();
    for(var i=0;i<first;i++) g.appendChild(el("span"));
    for(var d=1; d<=n; d++){
      (function(day){
        var key = k+"-"+(day<10?"0":"")+day, b = el("button","",String(day));
        b.type = "button"; b.disabled = !has[key];
        b.setAttribute("aria-pressed", String(state.day===key));
        b.onclick = function(){ state.day = state.day===key ? "" : key; renderCal(); render(); };
        g.appendChild(b);
      })(d);
    }
    box.appendChild(g); cal.appendChild(box);
  });
}
function render(){
  var list = $("list"); list.textContent = "";
  var t0 = today(), q = state.q.toLowerCase();
  var items = EVENTS.filter(function(e){
    return e.d>=t0 &&
      (state.sport==="Все"||e.s===state.sport) && (state.region==="Все"||e.r===state.region) &&
      (state.price==="Все" || (state.price==="Бесплатно")===isFree(e)) &&
      (!state.day||e.d===state.day) && (!state.fav||FAVS.indexOf(e.id)>=0) &&
      (!q || [e.t,e.c,e.p,e.o,e.s].join(" ").toLowerCase().indexOf(q)>=0);
  }).sort(function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0)});
  $("count").textContent = items.length ? "Найдено: "+items.length : "";
  if(!items.length){
    var em = el("div","empty","Под такие условия ничего не нашлось. Сбросьте фильтры, чтобы увидеть все предстоящие события.");
    var rb0 = el("button","chip","Сбросить фильтры"); rb0.type = "button"; rb0.onclick = resetAll;
    em.appendChild(document.createElement("br")); em.appendChild(rb0); list.appendChild(em);
    return;
  }
  items.forEach(function(e){
    var card = el("article","card"); card.id = "e-"+e.id;
    var poster = el("div","poster"), url = safeUrl(e.img);
    if(url){ var im = document.createElement("img"); im.src = url; im.alt = ""; im.loading = "lazy"; poster.appendChild(im); }
    else { var cp = el("div","cp"); cp.appendChild(el("b","",String(+e.d.slice(8)))); poster.appendChild(cp); }
    poster.appendChild(el("span","badge",label(e.d)));
    var hb = el("button","heart", FAVS.indexOf(e.id)>=0 ? "♥" : "♡");
    hb.type = "button"; hb.setAttribute("aria-label","В избранное");
    hb.onclick = function(){
      var i = FAVS.indexOf(e.id);
      if(i<0) FAVS.push(e.id); else FAVS.splice(i,1);
      saveFavs(); hb.textContent = i<0 ? "♥" : "♡"; if(state.fav) render();
    };
    poster.appendChild(hb);
    var body = el("div","cbody");
    body.appendChild(el("h3","",e.t));
    body.appendChild(el("p","meta",[e.c,e.p].filter(Boolean).join(", ")));
    var tags = el("div","tags");
    tags.appendChild(el("span","tag", e.price || "Бесплатно"));
    if(e.s) tags.appendChild(el("span","tag",e.s));
    if(e.r) tags.appendChild(el("span","tag r",e.r));
    if(e.o) tags.appendChild(el("span","tag",e.o));
    body.appendChild(tags);
    var acts = el("div","acts"), host = el("div","panel");
    var link = safeUrl(e.l);
    if(link){ var a = el("button","chip","Подробнее"); a.type = "button"; a.onclick = function(){ openExternal(link); }; acts.appendChild(a); }
    if(e.id && API.indexOf("https://")===0){
      var rb = el("button","chip","Заявки и участники"); rb.type = "button";
      rb.onclick = function(){ togglePanel(e, host); }; acts.appendChild(rb);
    }
    if(SHARE_BASE.indexOf("SHORTNAME")<0){ var sb = el("button","chip","Поделиться"); sb.type = "button"; sb.onclick = function(){ share(e); }; acts.appendChild(sb); }
    body.appendChild(acts); body.appendChild(host);
    card.appendChild(poster); card.appendChild(body); list.appendChild(card);
  });
}

fetch("events.json", {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(data){
    EVENTS = data;
    mkChips($("fSport"), "sport", uniq("s"));
    mkChips($("fRegion"), "region", uniq("r"));
    mkChips($("fPrice"), "price", ["Все","Бесплатно","Платно"]);
    $("q").addEventListener("input", function(){ state.q = this.value; render(); });
    $("bFav").onclick = function(){
      state.fav = !state.fav; this.setAttribute("aria-pressed", String(state.fav)); render();
    };
    renderCal();
    loadFavs(function(){
      render();
      var sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
      var t = sp && document.getElementById("e-"+sp);
      if(t) t.scrollIntoView();
    });
  })
  .catch(function(){
    $("list").textContent = "";
    $("list").appendChild(el("p","empty","Не удалось загрузить события. Проверьте интернет и откройте календарь ещё раз."));
  });
</script>
</body>
</html>
